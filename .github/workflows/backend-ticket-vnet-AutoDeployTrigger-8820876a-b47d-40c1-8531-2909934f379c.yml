# .github/workflows/build-and-deploy.yml
name: build-and-deploy-backend-ticketapp

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write        # for Azure OIDC login
  contents: read

env:
  AZURE_RESOURCE_GROUP: "App"
  CONTAINER_APP_NAME: "backend-ticketapp"
  ACR_NAME: "${{ secrets.AZ_ACR_NAME }}"       # e.g. myregistry123
  ACR_REPO: "backend-ticketapp"                # repo name in ACR (you can change)
  APP_PATH: "ticketingapp"                     # folder that contains your Dockerfile
  DOCKERFILE: "ticketingapp/Dockerfile"
  TARGET_PORT: "8080"

jobs:
  build_push_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.BACKENDTICKETAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.BACKENDTICKETAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.BACKENDTICKETAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Get ACR login server & login Docker to ACR
        id: acr
        run: |
          LOGIN_SERVER=$(az acr show -n "${ACR_NAME}" --query loginServer -o tsv)
          echo "login_server=$LOGIN_SERVER" >> $GITHUB_OUTPUT
          # login to ACR using the Azure CLI token (no stored passwords needed)
          az acr login -n "${ACR_NAME}"
      - name: Set image tag
        id: img
        run: |
          echo "name=${{ steps.acr.outputs.login_server }}/${{ env.ACR_REPO }}:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_PATH }}
          file: ${{ env.DOCKERFILE }}
          push: true
          tags: ${{ steps.img.outputs.name }}
          cache-from: type=registry,ref=${{ steps.acr.outputs.login_server }}/${{ env.ACR_REPO }}:buildcache
          cache-to: type=registry,ref=${{ steps.acr.outputs.login_server }}/${{ env.ACR_REPO }}:buildcache,mode=max

      # (One-time) ensure the Container App is allowed to pull from this ACR.
      # Safe to run repeatedly; it will just update the registry settings.
      - name: Attach ACR to Container App (idempotent)
        run: |
          az containerapp registry set \
            -g "${AZURE_RESOURCE_GROUP}" \
            -n "${CONTAINER_APP_NAME}" \
            --server "${{ steps.acr.outputs.login_server }}"

      - name: Deploy new image to Azure Container Apps
        run: |
          az containerapp update \
            -g "${AZURE_RESOURCE_GROUP}" \
            -n "${CONTAINER_APP_NAME}" \
            --image "${{ steps.img.outputs.name }}"
