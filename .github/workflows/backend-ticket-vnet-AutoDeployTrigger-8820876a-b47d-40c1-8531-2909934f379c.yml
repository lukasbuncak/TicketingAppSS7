name: Build & deploy backend to Azure Container Apps (via ACR)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AZ_ACR_NAME: ${{ secrets.AZ_ACR_NAME }}                  # e.g. ticketappacr
  AZ_RESOURCE_GROUP: ${{ secrets.AZ_RESOURCE_GROUP }}      # e.g. App
  AZ_CONTAINERAPP_NAME: ${{ secrets.AZ_CONTAINERAPP_NAME }}# e.g. backend-ticket-vnet

  ACR_LOGIN_SERVER: ${{ secrets.AZ_ACR_NAME }}.azurecr.io
  IMAGE_NAME: ${{ secrets.AZ_CONTAINERAPP_NAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.BACKENDTICKETAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.BACKENDTICKETAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.BACKENDTICKETAPP_AZURE_SUBSCRIPTION_ID }}

      - name: "ACR docker login"
        id: acrlogin
        run: |
          TOKEN=$(az acr login -n "$AZ_ACR_NAME" --expose-token --query accessToken -o tsv)
          echo "$TOKEN" | docker login "$ACR_LOGIN_SERVER" \
            --username 00000000-0000-0000-0000-000000000000 \
            --password-stdin

      - name: Build and push image
        run: |
          APP_DIR=./                                  # change if your backend is in a subfolder
          DOCKERFILE=./Dockerfile                     # change if the Dockerfile path differs

          IMAGE_SHA_TAG="$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}"
          IMAGE_LATEST_TAG="$ACR_LOGIN_SERVER/$IMAGE_NAME:latest"

          docker build -f "$DOCKERFILE" "$APP_DIR" -t "$IMAGE_SHA_TAG" -t "$IMAGE_LATEST_TAG"
          docker push "$IMAGE_SHA_TAG"
          docker push "$IMAGE_LATEST_TAG"

          echo "IMAGE_SHA_TAG=$IMAGE_SHA_TAG" >> $GITHUB_ENV
          echo "IMAGE_LATEST_TAG=$IMAGE_LATEST_TAG" >> $GITHUB_ENV

      - name: Ensure registry on Container App
        run: |
          az containerapp registry set \
            --name "$AZ_CONTAINERAPP_NAME" \
            --resource-group "$AZ_RESOURCE_GROUP" \
            --server "$ACR_LOGIN_SERVER" \
            --identity system

      - name: Update Container App image
        run: |
          az containerapp update \
            --name "$AZ_CONTAINERAPP_NAME" \
            --resource-group "$AZ_RESOURCE_GROUP" \
            --image "$IMAGE_SHA_TAG"
