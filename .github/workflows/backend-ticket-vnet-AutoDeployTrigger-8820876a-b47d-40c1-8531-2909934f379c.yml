name: build-and-deploy-backend-ticketapp

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Needed for Azure OIDC login
permissions:
  id-token: write
  contents: read

jobs:
  build_push_deploy:
    runs-on: ubuntu-latest

    env:
      # Resource names come from your repo secrets (see screenshot)
      AZURE_RESOURCE_GROUP: ${{ secrets.AZ_RESOURCE_GROUP }}
      CONTAINER_APP_NAME:   ${{ secrets.AZ_CONTAINERAPP_NAME }}
      ACR_NAME:             ${{ secrets.AZ_ACR_NAME }}     # just the ACR resource name (no .azurecr.io)
      ACR_REPO:             backend-ticketapp              # repo inside ACR
      APP_PATH:             ticketingapp                   # folder that has Dockerfile
      DOCKERFILE:           ticketingapp/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.BACKENDTICKETAPP_AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.BACKENDTICKETAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.BACKENDTICKETAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Container Apps CLI is available
        run: |
          set -e
          az extension add --name containerapp --upgrade
          az provider register --namespace Microsoft.App --wait
          az provider register --namespace Microsoft.ContainerRegistry --wait

      - name: Get ACR login server & login Docker to ACR
        id: acr
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ACR_NAME}" ]]; then
            echo "Secret AZ_ACR_NAME is empty." >&2
            exit 1
          fi
          LOGIN_SERVER=$(az acr show -n "${ACR_NAME}" --query loginServer -o tsv)
          echo "login_server=$LOGIN_SERVER" >> "$GITHUB_OUTPUT"
          # Authenticate Docker to ACR using the Azure CLI session (no passwords)
          az acr login -n "${ACR_NAME}"

      - name: Compute image tag
        id: img
        shell: bash
        run: |
          echo "name=${{ steps.acr.outputs.login_server }}/${{ env.ACR_REPO }}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image (Dockerfile in ticketingapp/)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_PATH }}
          file: ${{ env.DOCKERFILE }}
          push: true
          tags: ${{ steps.img.outputs.name }}
          cache-from: type=registry,ref=${{ steps.acr.outputs.login_server }}/${{ env.ACR_REPO }}:buildcache
          cache-to:   type=registry,ref=${{ steps.acr.outputs.login_server }}/${{ env.ACR_REPO }}:buildcache,mode=max

      # ---- ACR <-> ACA permissions via Managed Identity (idempotent) ----
      - name: Allow Container App to pull from ACR (managed identity)
        shell: bash
        run: |
          set -euo pipefail
          RG="${AZURE_RESOURCE_GROUP}"
          APP="${CONTAINER_APP_NAME}"
          ACR="${ACR_NAME}"

          ACR_LOGIN_SERVER=$(az acr show -n "$ACR" --query loginServer -o tsv)
          ACR_ID=$(az acr show -n "$ACR" --query id -o tsv)

          # Ensure system-assigned identity on the Container App
          az containerapp identity assign -g "$RG" -n "$APP" --system >/dev/null

          # Principal ID of that identity
          PRINCIPAL_ID=$(az containerapp show -g "$RG" -n "$APP" --query identity.principalId -o tsv)

          # Grant AcrPull on ACR to that principal (safe to re-run)
          az role assignment create \
            --assignee "$PRINCIPAL_ID" \
            --role "AcrPull" \
            --scope "$ACR_ID" \
            >/dev/null || echo "AcrPull role assignment already exists."

          # Attach the registry using the system identity (prevents ACR credential prompts)
          az containerapp registry set \
            -g "$RG" \
            -n "$APP" \
            --server "$ACR_LOGIN_SERVER" \
            --identity system

          # Optional: brief pause to let RBAC propagate
          sleep 15

      - name: Deploy new image to Azure Container Apps
        shell: bash
        run: |
          az containerapp update \
            -g "${AZURE_RESOURCE_GROUP}" \
            -n "${CONTAINER_APP_NAME}" \
            --image "${{ steps.img.outputs.name }}"
