name: Build & Deploy (backend-ticketapp)

on:
  push:
    branches: [ main ]
    paths:
      - 'ticketingapp/**'
      - '.github/workflows/build-and-deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RG: ${{ secrets.AZ_RESOURCE_GROUP }}            # e.g. App
  APP: ${{ secrets.AZ_CONTAINERAPP_NAME }}        # e.g. backend-ticketapp
  ACR: ${{ secrets.AZ_ACR_NAME }}                 # e.g. ticketappacr
  IMAGE_NAME: backend-ticketapp                   # repo name inside ACR
  DOCKER_BUILDKIT: 1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.BACKENDTICKETAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.BACKENDTICKETAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.BACKENDTICKETAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Get ACR login server
        id: acr
        run: |
          echo "SERVER=$(az acr show -n "$ACR" --query loginServer -o tsv)" >> $GITHUB_OUTPUT

      - name: Docker login to ACR (token, no admin user needed)
        run: |
          TOKEN=$(az acr login -n "$ACR" --expose-token --output tsv --query accessToken)
          echo "$TOKEN" | docker login https://${{ steps.acr.outputs.SERVER }} \
            --username 00000000-0000-0000-0000-000000000000 --password-stdin

      - name: Build image (uses ticketingapp/Dockerfile and context)
        run: |
          REG="${{ steps.acr.outputs.SERVER }}"
          TAG="${GITHUB_SHA}"
          docker build \
            -f ticketingapp/Dockerfile \
            -t "$REG/$IMAGE_NAME:$TAG" \
            ticketingapp

      - name: Push image
        run: |
          REG="${{ steps.acr.outputs.SERVER }}"
          TAG="${GITHUB_SHA}"
          docker push "$REG/$IMAGE_NAME:$TAG"

      - name: Update Container App to new image
        run: |
          REG="${{ steps.acr.outputs.SERVER }}"
          TAG="${GITHUB_SHA}"
          az containerapp update \
            -n "$APP" -g "$RG" \
            --image "$REG/$IMAGE_NAME:$TAG"
