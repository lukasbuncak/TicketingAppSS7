name: build-and-deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Needed for Azure OIDC login
permissions:
  id-token: write
  contents: read

env:
  # <<<---- adjust these to your environment
  AZURE_RESOURCE_GROUP: App
  CONTAINER_APP_NAME: backend-ticketapp
  ACR_NAME: youracrname              # Just the ACR name (no .azurecr.io)
  IMAGE_REPO: backend-ticketapp      # Repository name inside ACR

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Container Apps CLI is available
        run: |
          az extension add --name containerapp --upgrade
          az provider register --namespace Microsoft.App --wait

      - name: Resolve ACR login server + login to ACR
        id: acr
        shell: bash
        run: |
          set -euo pipefail
          ACR_LOGIN_SERVER=$(az acr show -n "$ACR_NAME" --query loginServer -o tsv)
          echo "login_server=$ACR_LOGIN_SERVER" >> "$GITHUB_OUTPUT"

          # Use the Azure CLI session to authenticate Docker to ACR
          az acr login -n "$ACR_NAME"

      - name: Build & push image (Dockerfile in ticketingapp/)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ticketingapp
          file: ticketingapp/Dockerfile
          push: true
          tags: ${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_REPO }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_REPO }}:buildcache
          cache-to: type=registry,ref=${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_REPO }}:buildcache,mode=max

      - name: Compute image name
        id: img
        shell: bash
        run: |
          echo "name=${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_REPO }}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # --- This fixes your error: attach ACR using managed identity and grant AcrPull ---
      - name: Allow Container App to pull from ACR (managed identity)
        shell: bash
        run: |
          set -euo pipefail
          RG="${AZURE_RESOURCE_GROUP}"
          APP="${CONTAINER_APP_NAME}"
          ACR="${ACR_NAME}"

          ACR_LOGIN_SERVER=$(az acr show -n "$ACR" --query loginServer -o tsv)
          ACR_ID=$(az acr show -n "$ACR" --query id -o tsv)

          # Ensure the app has a system-assigned identity (idempotent)
          az containerapp identity assign -g "$RG" -n "$APP" --system >/dev/null

          # Get its principalId
          PRINCIPAL_ID=$(az containerapp show -g "$RG" -n "$APP" --query identity.principalId -o tsv)

          # Grant AcrPull on the ACR to that identity (idempotent)
          az role assignment create \
            --assignee "$PRINCIPAL_ID" \
            --role "AcrPull" \
            --scope "$ACR_ID" \
            >/dev/null || echo "Role assignment may already exist."

          # Attach the ACR to the app so it uses the system identity to pull
          az containerapp registry set \
            -g "$RG" \
            -n "$APP" \
            --server "$ACR_LOGIN_SERVER" \
            --identity system

      - name: Deploy new image to Azure Container Apps
        shell: bash
        run: |
          az containerapp update \
            -g "${AZURE_RESOURCE_GROUP}" \
            -n "${CONTAINER_APP_NAME}" \
            --image "${{ steps.img.outputs.name }}"
