name: build-and-deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Required for OIDC (azure/login@v2)
permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # Put env here so secrets resolve cleanly
    env:
      # ----- names of your Azure resources -----
      AZURE_RESOURCE_GROUP: ${{ secrets.AZ_RESOURCE_GROUP }}
      CONTAINER_APP_NAME:   ${{ secrets.AZ_CONTAINERAPP_NAME }}
      ACR_NAME:             ${{ secrets.AZ_ACR_NAME }}          # e.g. myacr123 (NO .azurecr.io)
      IMAGE_REPO:           backend-ticketapp                   # repo name inside ACR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.BACKENDTICKETAPP_AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.BACKENDTICKETAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.BACKENDTICKETAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Container Apps CLI is available
        run: |
          set -e
          az extension add --name containerapp --upgrade
          az provider register --namespace Microsoft.App --wait

      - name: Resolve ACR login server + login to ACR
        id: acr
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ACR_NAME}" ]]; then
            echo "ACR_NAME is empty. Set secret AZ_ACR_NAME to your ACR resource name." >&2
            exit 1
          fi
          ACR_LOGIN_SERVER=$(az acr show -n "$ACR_NAME" --query loginServer -o tsv)
          echo "login_server=$ACR_LOGIN_SERVER" >> "$GITHUB_OUTPUT"

          # Authenticate Docker to ACR using the azure/login OIDC session
          az acr login -n "$ACR_NAME"

      - name: Build & push image (Dockerfile in ticketingapp/)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ticketingapp
          file: ticketingapp/Dockerfile
          push: true
          tags: ${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_REPO }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_REPO }}:buildcache
          cache-to:   type=registry,ref=${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_REPO }}:buildcache,mode=max

      - name: Compute image name
        id: img
        shell: bash
        run: |
          echo "name=${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_REPO }}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # Give the Container App permission to pull from ACR via its managed identity (idempotent)
      - name: Allow Container App to pull from ACR (managed identity)
        shell: bash
        run: |
          set -euo pipefail
          RG="${AZURE_RESOURCE_GROUP}"
          APP="${CONTAINER_APP_NAME}"
          ACR="${ACR_NAME}"

          if [[ -z "$RG" || -z "$APP" || -z "$ACR" ]]; then
            echo "One of AZ_RESOURCE_GROUP / AZ_CONTAINERAPP_NAME / AZ_ACR_NAME secrets is missing." >&2
            exit 1
          fi

          ACR_LOGIN_SERVER=$(az acr show -n "$ACR" --query loginServer -o tsv)
          ACR_ID=$(az acr show -n "$ACR" --query id -o tsv)

          # Ensure the Container App has a system-assigned managed identity
          az containerapp identity assign -g "$RG" -n "$APP" --system >/dev/null

          # Look up that identity's principalId
          PRINCIPAL_ID=$(az containerapp show -g "$RG" -n "$APP" --query identity.principalId -o tsv)

          # Grant AcrPull to that principal on the ACR (safe to re-run)
          az role assignment create \
            --assignee "$PRINCIPAL_ID" \
            --role "AcrPull" \
            --scope "$ACR_ID" \
            >/dev/null || echo "Role assignment may already exist."

          # Attach the registry so the app uses its MI to pull images
          az containerapp registry set \
            -g "$RG" \
            -n "$APP" \
            --server "$ACR_LOGIN_SERVER" \
            --identity system

      - name: Deploy new image to Azure Container Apps
        shell: bash
        run: |
          az containerapp update \
            -g "${AZURE_RESOURCE_GROUP}" \
            -n "${CONTAINER_APP_NAME}" \
            --image "${{ steps.img.outputs.name }}"
