# CORS: your real domains
app.cors.allowed-origins=https://ticketsapp.org,https://www.ticketsapp.org

# Azure Postgres (env-driven, no secrets in Git)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Safer logging in prod
spring.jpa.show-sql=false
logging.level.org.springframework.web=INFO

# Actuator: limit details in prod
management.endpoint.health.show-details=never

# JWT from env/secrets in the platform
jwt.secret=${JWT_SECRET}
jwt.issuer=ticketingapp
jwt.audience=tickets-frontend
jwt.access.expiration-hours=1

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Connection pool tuning (avoid stale sockets, smoother scale)
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=600000

# Consistent timestamps
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Dont accidentally run SQL init alongside Flyway
spring.sql.init.mode=never

# Recommended to avoid lazy-loading surprises in web layer
spring.jpa.open-in-view=false