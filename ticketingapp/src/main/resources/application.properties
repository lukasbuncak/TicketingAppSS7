spring.application.name=ticketingapp
# Let platforms override port (ACA/AKS often set PORT)
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Health probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

#for testing purposes - hacking week
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html


# JPA/Flyway common
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=core
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=core,auth,tickets
spring.flyway.validate-migration-naming=true

# Logging tone down in prod via profile
spring.jpa.show-sql=false
logging.level.org.springframework.web=INFO

#Hashing
security.argon2.salt-length=20
security.argon2.hash-length=32
security.argon2.parallelism=2
security.argon2.memory=65536
security.argon2.iterations=8